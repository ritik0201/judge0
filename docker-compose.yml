services:
  server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "${JUDGE0_HOST_BIND:-127.0.0.1}:${JUDGE0_PORT:-2358}:2358"
    privileged: true
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2358/system_info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: judge0-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-judge0_postgres_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-judge0}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-judge0} -d ${POSTGRES_DB:-judge0}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: judge0-redis
    command: ["sh", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-judge0_redis_secure_password_2026}
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-judge0_redis_secure_password_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: judge0_postgres_data
  redis-data:
    name: judge0_redis_data
